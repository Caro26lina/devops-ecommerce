<!DOCTYPE html>
<html>
<head>
  <title>ShopEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🛒 ShopEase Store</h1>
</header>

<!-- PRODUCTS -->
<div class="products">

  <div class="card">
    <h3>Watch</h3>
    <p>₹1000</p>
    <button onclick="addToCart('Watch', 1000)">Add to Cart</button>
  </div>

  <div class="card">
    <h3>Shoes</h3>
    <p>₹2000</p>
    <button onclick="addToCart('Shoes', 2000)">Add to Cart</button>
  </div>

  <div class="card">
    <h3>Bag</h3>
    <p>₹800</p>
    <button onclick="addToCart('Bag', 800)">Add to Cart</button>
  </div>

</div>

<!-- CART TABLE -->
<h2 style="text-align:center;">🧾 Cart</h2>

<table id="cartTable">
  <tr>
    <th>Product</th>
    <th>Price</th>
  </tr>
</table>

<h3 style="text-align:center;" id="total">Total: ₹0</h3>

<script src="script.js"></script>

</body>
</html>
