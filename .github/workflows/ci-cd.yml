name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t devops_proj:latest .

    - name: Tag Image
      run: docker tag devops_proj:latest ${{ secrets.DOCKER_USERNAME }}/devops_proj:latest

    - name: Push Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/devops_proj:latest